name: Sync memes from Feishu

# 你只管在飞书多维表格里填数据，这个工作流负责把表同步成仓库里的 JSON，
# 并顺带更新「点词查询」用的词表。
#
# 需要先配置（Settings → Secrets and variables → Actions）：
#   Secrets:   FEISHU_APP_ID / FEISHU_APP_SECRET    ← 从飞书开发者后台拿
#   Variables: MEME_TABLE_URL                       ← 你的多维表格分享链接
#   （可选）Secret: DEEPSEEK_API_KEY                ← 不配则用 GitHub Models
#
# 密钥只存在于 GitHub 加密 Secrets 里，绝不会出现在代码或 App 中。

on:
  schedule:
    # 每 6 小时。想更实时可改成 '*/15 * * * *'（GitHub 定时任务可能有几分钟延迟）
    - cron: '0 */6 * * *'
  workflow_dispatch:        # 也支持手动点一下立即同步

permissions:
  contents: write
  models: read              # 让词表生成步骤能用内置的 GITHUB_TOKEN 调 LLM，无需额外密钥

concurrency:
  group: sync-memes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # feishu-tool 是零依赖的，直接跑，不需要 npm install
      - name: 从飞书导出表格
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          TABLE_URL: ${{ vars.MEME_TABLE_URL }}
        run: |
          if [ -z "$TABLE_URL" ]; then
            echo "::error::没有配置 MEME_TABLE_URL 变量"
            exit 1
          fi
          node tools/feishu-tool/bin/feishu.mjs export \
            --url "$TABLE_URL" \
            --sort-by ID \
            --out data/memes.json

      # 词表生成。
      #
      # 成本控制：memes.json 没变化就直接跳过，不调用 LLM（0 token）。
      # 有新梗时只补缺失的词，已有词条一律保留（不会覆盖你手工修正的内容）。
      #
      # 容错：这一步失败不影响梗数据同步 —— 词表保持原样，App 只是
      # 对缺的词不可点，功能不会坏。
      - name: 生成/更新词表
        continue-on-error: true
        env:
          # 优先用 DeepSeek；没配则回落到 GitHub Models（用内置 token，免费）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/words/generate.mjs

      # 给新词补发音音频（已生成的会跳过，幂等）。
      # 音频打包进 APK，这样 App 不依赖手机的 TTS 引擎 ——
      # 国行机型普遍没有日语音色。
      # 失败不影响数据同步：没音频的词会回退到系统 TTS。
      - name: 生成新词的发音音频
        continue-on-error: true
        run: |
          python -m pip install --quiet edge-tts
          python tools/audio/generate_audio.py

      # 同步到 assets，让「内置兜底数据」也保持最新
      - name: 更新内置兜底数据
        run: |
          cp data/memes.json app/src/main/assets/memes.json
          cp data/words.json app/src/main/assets/words.json

      - name: 有变化才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/ app/src/main/assets/; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          COUNT=$(node -e "console.log(require('./data/memes.json').length)")
          WORDS=$(node -e "const w=require('./data/words.json');console.log(Object.keys(w.en).length+'+'+Object.keys(w.ja).length)")
          git add data/ app/src/main/assets/
          git commit -m "chore(data): sync ${COUNT} memes from Feishu table (words ${WORDS})"
          git push
